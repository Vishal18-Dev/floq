version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: floq_postgres
    environment:
      POSTGRES_USER: floq
      POSTGRES_PASSWORD: floq_dev_password_2026
      POSTGRES_DB: floq_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U floq -d floq_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
