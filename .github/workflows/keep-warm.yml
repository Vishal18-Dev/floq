name: keep-warm

# Pings the backend's health endpoint through the day so the free-tier instance
# doesn't spin down during a merchant's operating hours. Cheap insurance against
# cold-start timeouts on the first sale. Remove once on an always-on paid plan.
#
# GitHub cron is UTC. 00:30–17:30 UTC ≈ 06:00–23:00 IST (merchant hours).
# Scheduled runs can be delayed a few minutes under load — fine for keep-warm.

on:
  schedule:
    - cron: "*/12 0-17 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          # -m 90 so a cold start has time to wake; never fail the job.
          code=$(curl -fsS -m 90 -o /dev/null -w "%{http_code}" https://floq.onrender.com/api/health || true)
          echo "health -> $code"
