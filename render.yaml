# Render Blueprint for the FLOQ backend.
# Create the service from the Render dashboard: New > Blueprint, point at this repo.
#
# IMPORTANT — the "starter" plan below is a PAID, always-on instance. This is
# deliberate: the free tier cold-starts (~30-60s) and the first sale of the
# morning would time out. Do not downgrade to free for a live beta.

services:
  - type: web
    name: floq-backend
    runtime: node
    plan: starter                     # paid, always-on — fixes the cold-start blocker
    region: singapore                 # closest Render region to India
    branch: redesign/floq-beta        # change to main once merged
    buildCommand: npm install && npm run build   # root build: shared packages + backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true           # Render generates a strong random secret
      - key: ADMIN_KEY
        sync: false                   # SET THIS YOURSELF in the dashboard — you need it for the onboarding CLI
      - key: DATABASE_URL
        fromDatabase:
          name: floq-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"                    # tighten to your web origins if/when you add a web client
      - key: PIN_LENGTH
        value: "4"

databases:
  - name: floq-db
    plan: basic-256mb                  # a real paid plan; the free DB expires after 90 days
    region: singapore
    postgresMajorVersion: "16"
